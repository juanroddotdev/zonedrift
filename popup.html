<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=360, initial-scale=1" />
    <title>ZoneDrift</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="header header--compact">
        <h1 class="header__title">ZoneDrift</h1>
      </header>

      <section class="search search--primary" aria-label="Search locations">
        <label class="search__label" for="search-input">Search locations</label>
        <input
          id="search-input"
          class="search__input search__input--primary"
          type="search"
          placeholder="Search states, code, region…"
          autocomplete="off"
          spellcheck="false"
        />
        <p id="status-message" class="status-message hidden" role="status" aria-live="polite"></p>

        <div id="search-results" class="search-results hidden" aria-live="polite">
          <ul id="search-list" class="search-results__list"></ul>
          <p id="search-empty" class="empty-state empty-state--compact hidden">
            No locations match your search.
          </p>
        </div>

        <div id="zone-picker" class="zone-picker hidden" aria-live="polite"></div>
      </section>

      <section class="scrubber scrubber--compact" aria-label="Time scrubber">
        <div class="scrubber__row scrubber__row--compact">
          <span id="scrub-badge" class="scrubber__badge scrubber__badge--compact">Now</span>
          <input
            id="scrub-slider"
            class="scrubber__slider scrubber__slider--compact"
            type="range"
            min="-12"
            max="12"
            step="0.5"
            value="0"
            aria-label="Hours from now"
            aria-valuetext="Now"
          />
          <button id="scrub-reset" type="button" class="btn btn--ghost btn--compact">Reset</button>
        </div>
      </section>

      <section class="pinned" aria-label="Pinned locations">
        <h2 class="section-title">Pinned</h2>
        <div id="pinned-list" class="pinned__list">
          <p class="empty-state" id="pinned-empty">
            Search above to add locations
          </p>
        </div>
      </section>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
