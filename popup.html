<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=360, initial-scale=1" />
    <title>ZoneDrift</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body>
    <div class="app">
      <div class="search-shell">
        <header class="app-header">
          <h1 class="app-header__title">ZoneDrift</h1>
          <label class="search__label" for="search-input">Search</label>
          <input
            id="search-input"
            class="search__input search__input--inline"
            type="search"
            placeholder="Search…"
            autocomplete="off"
            spellcheck="false"
            role="combobox"
            aria-expanded="false"
            aria-controls="search-suggestions"
          />
          <button
            id="planner-toggle"
            type="button"
            class="btn btn--ghost planner-toggle"
            aria-expanded="false"
            aria-controls="planner-panel"
            aria-label="Time planner"
            title="Time planner"
          >
            ⏱
          </button>
        </header>

        <div
          id="search-suggestions"
          class="search-suggestions hidden"
          role="listbox"
          aria-label="Search suggestions"
        ></div>
      </div>

      <p id="status-message" class="status-message hidden" role="status" aria-live="polite"></p>

      <section class="saved" aria-label="Saved locations">
        <h2 class="section-title">Saved</h2>
        <div id="pinned-list" class="saved__list loc-list">
          <p class="empty-state" id="pinned-empty">
            No saved locations yet — search to add a city
          </p>
        </div>
      </section>

      <section id="planner-panel" class="planner-panel hidden" aria-label="Time planner">
        <div class="scrubber scrubber--compact">
          <div class="scrubber__row scrubber__row--compact">
            <span id="scrub-badge" class="scrubber__badge scrubber__badge--compact">Now</span>
            <input
              id="scrub-slider"
              class="scrubber__slider scrubber__slider--compact"
              type="range"
              min="-12"
              max="12"
              step="0.5"
              value="0"
              aria-label="Hours from now"
              aria-valuetext="Now"
            />
            <button id="scrub-reset" type="button" class="btn btn--ghost btn--compact">Reset</button>
          </div>
        </div>
      </section>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
